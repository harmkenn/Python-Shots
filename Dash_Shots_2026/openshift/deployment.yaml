apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-dash-shots
  labels:
    app: python-dash-shots
spec:
  replicas: 2
  selector:
    matchLabels:
      app: python-dash-shots
  template:
    metadata:
      labels:
        app: python-dash-shots
    spec:
      containers:
        - name: app
          image: python-dash-shots:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: GOOGLE_MAPS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: google-geo
                  key: GOOGLE_MAPS_API_KEY
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
